[project]
name = "local-rag-btp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "rasoul", email = "rasoul.islangueriev@etu.unice.fr" }
]
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "langchain>=1.5.0",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-ollama>=1.1.0",
    "ollama>=0.6.3",
    "python-dotenv>=1.2.4",
    "unstructured[all-docs]>=0.27.37",
]

[project.scripts]
local-rag-btp = "local_rag_btp:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"
